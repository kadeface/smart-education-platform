{# templates/client/school_level_select.html #}
{% extends "base.html" %}

{% block content %}
<div class="container mx-auto py-10 px-2 md:px-0">
    <h2 class="text-2xl font-bold text-blue-700 mb-8 text-center">{{ module_name }}</h2>
    
    <div class="row mt-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
        {% for level_name, level_code in school_levels.items %}
        <div class="col-md-4">
            <div class="card bg-white rounded-2xl shadow-lg p-8 flex flex-col items-center hover:shadow-2xl transition animate__animated animate__fadeInUp">
                <div class="card-body text-center">
                    <h3 class="text-lg font-semibold mb-2 text-blue-600">{{ level_name }}</h3>
                    <p class="text-gray-600 mb-4">{{ level_name }}增值评价分析</p>
                    <a href="{% url 'client:exam_select' module_type level_code %}"
                       class="btn btn-success btn-block animate__animated animate__fadeInUp shadow transition hover:shadow-lg">
                        <i class="fas fa-chart-line mr-2"></i> 查看分析
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
