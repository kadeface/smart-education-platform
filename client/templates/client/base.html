<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}成绩分析系统{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Animate.css CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-blue-50 to-green-50 min-h-screen text-gray-800">
    <!-- 顶部导航 -->
    <nav class="bg-white bg-opacity-80 backdrop-blur shadow-md py-4 px-8 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fas fa-chart-line text-blue-600 text-2xl"></i>
            <span class="text-2xl font-bold text-blue-700">成绩分析系统</span>
        </div>
        <div>
            <!-- 可根据需要添加导航链接 -->
            <a href="{% url 'index' %}" class="text-gray-700 hover:text-blue-600 mx-2">首页</a>
            <a href="{% url 'exam_select' %}" class="text-gray-700 hover:text-blue-600 mx-2">成绩分析</a>
        </div>
    </nav>
    <!-- 主体内容 -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <!-- 页脚 -->
    <footer class="text-center text-gray-500 py-6">
        &copy; {{ now|date:"Y" }} 成绩分析系统 | 现代教育数据平台
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
