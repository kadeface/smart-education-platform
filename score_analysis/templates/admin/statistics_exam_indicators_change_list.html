<!-- templates/admin/statistics_exam_indicators_change_list.html -->

{% extends "score_analysis/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
    {{ block.super }}

    {% if perms.score_processor.change_statisticsexamindicators %}
    <li>
        <a href="#" onclick="showUpdateDialog()" class="addlink">
            更新统计数据
        </a>
    </li>
    {% endif %}
{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
    .dialog-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
    }
    .dialog-content {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        border-radius: 5px;
    }
</style>
<script>
function showUpdateDialog() {
    // 创建对话框
    var dialog = document.createElement('div');
    dialog.className = 'dialog-overlay';
    dialog.innerHTML = `
        <div class="dialog-content">
            <h3>更新统计数据</h3>
            <form id="updateStatsForm">
                <div style="margin-bottom: 10px;">
                    <label>考试ID：</label>
                    <input type="text" name="exam_id" required>
                </div>
                <div style="margin-bottom: 10px;">
                    <label>类型：</label>
                    <select name="select_type" required>
                        <option value="文科">文科</option>
                        <option value="理科">理科</option>
                    </select>
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="default">确定</button>
                    <button type="button" onclick="closeDialog()">取消</button>
                </div>
            </form>
        </div>
    `;

    document.body.appendChild(dialog);
    dialog.style.display = 'block';

    // 表单提交处理
    document.getElementById('updateStatsForm').onsubmit = function(e) {
        e.preventDefault();
        var exam_id = this.exam_id.value;
        var select_type = this.select_type.value;
        window.location.href = `update_statistics/${exam_id}/${select_type}/`;
    };
}

function closeDialog() {
    document.querySelector('.dialog-overlay').remove();
}
</script>
{% endblock %}
