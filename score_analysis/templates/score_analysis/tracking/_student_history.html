<!-- templates/score_analysis/tracking/_student_history.html -->
{% load custom_filters %}
{% block styles %}
<style>
.analysis-table th,
.analysis-table td {
    padding: 0.4rem;
    text-align: center;
    vertical-align: middle;
}
.analysis-table thead th {
    background-color: #f8f9fa;
    border-bottom: 2px solid #dee2e6;
}
.card-title { font-size: 0.9rem; color: #6c757d; }
.progress { background-color: #e9ecef; }
.progress-bar { background-color: #28a745; }
@media (max-width: 768px) {
    .analysis-table { font-size: 0.75rem; }
    .card-title { font-size: 0.8rem; }
}
</style>
{% endblock %}
<div class="bg-white rounded-2xl shadow-lg animate__animated animate__fadeInUp mb-4">
    <div class="card-body">
        <h5 class="card-title mb-3">学生成绩历史</h5>
        <div class="table-responsive">
            <table class="table table-hover analysis-table">
                <thead>
                    <tr>
                        {% for col in table_columns %}
                        <th>{{ col }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for row in table_data %}
                    <tr>
                        {% for col in table_columns %}
                        <td>{{ row|get_item:col }}</td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="mt-3 text-end">
            <button class="btn btn-success animate__animated animate__fadeInUp shadow transition">关闭</button>
        </div>
    </div>
</div>
