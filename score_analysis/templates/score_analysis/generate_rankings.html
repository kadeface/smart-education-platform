{% extends "score_analysis/base_site.html" %}

{% block content %}
<div class="tab-container">
    <div class="tab-header">
        <button class="tab-btn active" data-tab="generate">排名生成</button>
        <button class="tab-btn" data-tab="history">生成历史</button>
    </div>

    <!-- 生成排名标签页 -->
    <div class="tab-content active" id="generate">
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <label>选择考试：</label>
                <select name="exam_id" id="exam-select">
                    <option value="">---------</option>
                    {% for exam in exams %}
                         <option value="{{ exam.exam_id }}">{{ exam.exam_name }} [{{ exam.exam_id }}]  </option>
                    {% endfor %}
                </select>
            </div>

            <div class="submit-row">
                <input type="submit" value="生成排名" class="btn btn-primary">
                <a href="../" class="closelink">返回列表</a>
            </div>
        </form>
    </div>

    <!-- 生成历史标签页 -->
    <div class="tab-content" id="history">
        <table class="history-table">
            <thead>
                <tr>
                    <th>生成时间</th>
                    <th>考试名称</th>
                    <th>生成结果数量</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody>
                {% for record in history_records %}
                <tr>
                    <td>{{ record.create_time|date:"Y-m-d H:i" }}</td>
                    <td>{{ record.exam_name }}</td>
                    <td>{{ record.count }}条</td>
                    <td>{{ record.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<style>
.tab-container {
    margin: 20px 0;
}

.tab-header {
    margin-bottom: 20px;
}

.tab-btn {
    padding: 8px 16px;
    margin-right: 10px;
    border: 1px solid #ccc;
    background: #f8f9fa;
    cursor: pointer;
}

.tab-btn.active {
    background: #007bff;
    color: white;
    border-color: #007bff;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.form-row {
    margin-bottom: 20px;
}

.form-row label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.form-row select {
    width: 100%;
    padding: 4px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.history-table {
    width: 100%;
    border-collapse: collapse;
}

.history-table th,
.history-table td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

.history-table th {
    background-color: #f5f5f5;
    font-weight: bold;
}

.history-table tr:hover {
    background-color: #f9f9f9;
}

.submit-row {
    margin-top: 20px;
    text-align: right;
}

.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.btn-primary {
    background-color: #007bff;
    color: white;
}

.btn-primary:hover {
    background-color: #0056b3;
}

.closelink {
    margin-left: 10px;
    color: #666;
    text-decoration: none;
}
</style>

<script>
// 标签页切换
document.querySelectorAll('.tab-btn').forEach(button => {
    button.addEventListener('click', function() {
        // 移除所有活动状态
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        // 添加新的活动状态
        this.classList.add('active');
        document.getElementById(this.dataset.tab).classList.add('active');
    });
});

// 表单提交验证
document.querySelector('form').addEventListener('submit', function(e) {
    const examId = document.getElementById('exam-select').value;
    console.log('提交时的考试ID:', examId);

    if (!examId) {
        e.preventDefault();
        alert('请选择考试！');
        return false;
    }
    return true;
});
</script>
{% endblock %}
