<!DOCTYPE html>
<html>
<head>
    <title>ID映射结果</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .stats {
            margin: 20px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>统一ID映射结果</h1>

    <div class="stats">
        <h2>映射统计</h2>
        {% if stats %}
            <ul>
            {% for key, value in stats.items %}
                <li>{{ key }}: {{ value }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    </div>

    <h2>数据预览（前10条记录）</h2>
    {% if preview %}
        {{ preview|safe }}
    {% endif %}

    <div style="margin-top: 20px;">
        <form method="post" action="{% url 'process_scores' %}">
            {% csrf_token %}
            <input type="hidden" name="exam_id" value="{{ exam_id }}">
            <button type="submit">开始处理成绩</button>
        </form>
        <a href="{% url 'upload_scores' %}">返回重新上传</a>
    </div>

</body>
</html>
